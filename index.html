<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>基于长短期偏好建模的下一兴趣点推荐系统（演示原型）</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --card: #ffffff;
      --primary: #2f5fa7;
      --primary-soft: #e8f0ff;
      --text: #1f2a44;
      --muted: #6c7895;
      --line: #d8e0ef;
      --ok: #1f9d55;
      --warn: #f59e0b;
      --bad: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    .hidden { display: none !important; }
    .app-header {
      background: linear-gradient(90deg, #244b84, #2f5fa7);
      color: #fff;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .app-title { font-size: 18px; font-weight: 700; }
    .container { padding: 16px 20px 30px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(20, 40, 80, 0.04);
    }
    .grid { display: grid; gap: 12px; }
    .grid.cards { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
    .stat {
      background: var(--primary-soft);
      border: 1px solid #c9d8fa;
      border-radius: 10px;
      padding: 12px;
    }
    .stat .label { color: var(--muted); font-size: 12px; }
    .stat .value { font-size: 22px; font-weight: 700; margin-top: 6px; }
    h2 { margin: 4px 0 12px; font-size: 19px; }
    h3 { margin: 2px 0 10px; font-size: 16px; }
    .tabs, .top-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    button, .btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: .15s;
      font-size: 14px;
    }
    button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .active-tab { background: var(--primary); color: #fff; border-color: var(--primary); }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 180px; }
    label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 13px; }
    input, select, textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 14px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid var(--line); padding: 9px 6px; text-align: left; }
    th { color: var(--muted); font-weight: 600; }
    .layout { display: flex; min-height: calc(100vh - 56px); }
    .sidebar {
      width: 220px;
      background: #eef3fc;
      border-right: 1px solid var(--line);
      padding: 12px;
    }
    .sidebar button { width: 100%; text-align: left; margin-bottom: 6px; }
    .main { flex: 1; padding: 14px; }
    .tag { padding: 2px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    .bad { color: var(--bad); }
    .muted { color: var(--muted); }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .notice { padding: 8px 10px; border-radius: 8px; background: #e9f8ef; border: 1px solid #c0e8ce; color: #17663a; margin-bottom: 10px; }
    .rec-card { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-bottom: 8px; }
    .collapse { background: #fafcff; border: 1px dashed #b9c8e9; border-radius: 8px; padding: 10px; }
    .login-wrap { max-width: 860px; margin: 26px auto; }
    .mini { font-size: 12px; color: var(--muted); }
    @media (max-width: 900px) {
      .layout { display: block; }
      .sidebar { width: 100%; }
      .split { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="app-title">下一兴趣点（Next POI）推荐系统 - 演示型原型</div>
    <div>
      <button id="goUser">用户端</button>
      <button id="goAdmin">管理端</button>
    </div>
  </header>

  <section id="userAuth" class="container login-wrap">
    <div class="split">
      <div class="card">
        <h2>用户登录</h2>
        <div class="row">
          <div><label>用户名</label><input id="loginName" placeholder="如：user1"></div>
          <div><label>密码</label><input id="loginPwd" type="password" placeholder="123456"></div>
        </div>
        <div style="margin-top:10px"><button class="primary" onclick="userLogin()">登录并进入首页</button></div>
        <p class="mini">演示账号：user1 / 123456，user2 / 123456</p>
      </div>
      <div class="card">
        <h2>用户注册</h2>
        <div class="row">
          <div><label>用户名</label><input id="regName"></div>
          <div><label>密码</label><input id="regPwd" type="password"></div>
          <div><label>确认密码</label><input id="regPwd2" type="password"></div>
        </div>
        <div style="margin-top:10px"><button onclick="registerUser()">注册</button></div>
      </div>
    </div>
  </section>

  <section id="userApp" class="container hidden">
    <div class="top-nav" id="userTabs"></div>
    <div id="userNotice"></div>
    <div id="userViews"></div>
  </section>

  <section id="adminAuth" class="container login-wrap hidden">
    <div class="card">
      <h2>管理员登录</h2>
      <div class="row">
        <div><label>管理员账号</label><input id="adminName" placeholder="admin"></div>
        <div><label>密码</label><input id="adminPwd" type="password" placeholder="admin123"></div>
      </div>
      <div style="margin-top:10px"><button class="primary" onclick="adminLogin()">登录后台</button></div>
    </div>
  </section>

  <section id="adminApp" class="hidden">
    <div class="layout">
      <aside class="sidebar" id="adminNav"></aside>
      <main class="main">
        <div id="adminNotice"></div>
        <div id="adminViews"></div>
      </main>
    </div>
  </section>

<script>
const data = {
  categories: ['餐饮','交通','娱乐','购物','学习'],
  pois: [
    {id:1,name:'第一食堂',cat:'餐饮',lat:'30.123',lng:'120.111',status:'上线'},
    {id:2,name:'星空咖啡馆',cat:'餐饮',lat:'30.124',lng:'120.113',status:'上线'},
    {id:3,name:'校园地铁站',cat:'交通',lat:'30.130',lng:'120.101',status:'上线'},
    {id:4,name:'南门公交站',cat:'交通',lat:'30.126',lng:'120.107',status:'上线'},
    {id:5,name:'光影电影院',cat:'娱乐',lat:'30.139',lng:'120.118',status:'上线'},
    {id:6,name:'潮玩电竞馆',cat:'娱乐',lat:'30.131',lng:'120.119',status:'下线'},
    {id:7,name:'中心商场',cat:'购物',lat:'30.136',lng:'120.120',status:'上线'},
    {id:8,name:'便利超市',cat:'购物',lat:'30.127',lng:'120.108',status:'上线'},
    {id:9,name:'主图书馆',cat:'学习',lat:'30.121',lng:'120.102',status:'上线'},
    {id:10,name:'教学楼A座',cat:'学习',lat:'30.122',lng:'120.104',status:'上线'}
  ],
  users: [
    {id:1,name:'admin',pwd:'admin123',role:'管理员',status:'启用',created:'2024-01-01'},
    {id:2,name:'user1',pwd:'123456',role:'普通用户',status:'启用',created:'2024-04-01'},
    {id:3,name:'user2',pwd:'123456',role:'普通用户',status:'启用',created:'2024-04-10'}
  ],
  models: [
    {id:'M-ZS-01',type:'零样本',name:'gpt-nextpoi-zero',version:'v1.0.0',enabled:true,def:true,endpoint:'/api/zero-shot'},
    {id:'M-FT-01',type:'微调',name:'bert-nextpoi-ft',version:'v2.3.1',enabled:true,def:false,model_path:'/models/bert_ft_v231.bin'}
  ],
  configs: [
    {k:'rec.topk.default',v:'5',desc:'默认Top-K',time:'2026-02-01 09:01:22'},
    {k:'feature.use_time.default',v:'true',desc:'默认启用时间特征',time:'2026-02-01 09:01:22'},
    {k:'feature.use_category.default',v:'true',desc:'默认启用类别特征',time:'2026-02-01 09:01:22'},
    {k:'inference.timeout_ms',v:'3000',desc:'推理超时',time:'2026-02-01 09:01:22'},
    {k:'inference.retry_times',v:'1',desc:'重试次数',time:'2026-02-01 09:01:22'}
  ],
  checkins: [],
  recs: [],
  logs: []
};

let currentUser = null;
let adminAuthed = false;
let userTab = '首页';
let adminTab = '仪表盘';

function now() { return new Date().toISOString().slice(0,19).replace('T',' '); }
function rid(prefix='REC'){ return prefix + '-' + Math.random().toString(36).slice(2,8).toUpperCase(); }
function getDefaultModel(){ return data.models.find(m=>m.def) || data.models[0]; }

function seed() {
  const base = ['第一食堂','主图书馆','星空咖啡馆','教学楼A座','中心商场','第一食堂','校园地铁站','主图书馆','便利超市','星空咖啡馆'];
  [2,3].forEach(uid=>{
    base.forEach((name,i)=>{
      const p = data.pois.find(x=>x.name===name);
      data.checkins.push({uid,time:new Date(Date.now()-((i+1)*86400000)).toISOString().slice(0,16).replace('T',' '),poi:p.name,cat:p.cat,stay:20+Math.floor(Math.random()*60)});
    });
    for(let r=0;r<3;r++) {
      const rec = generateRec(uid,5,true,true,true);
      rec.time = new Date(Date.now()-((r+1)*43200000)).toISOString().slice(0,19).replace('T',' ');
      data.recs.push(rec);
    }
  });
}

function log(path,method,uid,cost,code,err='') {
  data.logs.unshift({time:now(),path,method,uid,cost,code,err});
}

function toast(target, msg) {
  const el = document.getElementById(target);
  el.innerHTML = `<div class="notice">${msg}</div>`;
  setTimeout(()=>el.innerHTML='',2500);
}

function generateRec(uid,k,useTime,useCat,silent=false) {
  const userChecks = data.checkins.filter(c=>c.uid===uid);
  const model = getDefaultModel();
  const recent = userChecks.slice(0,3);
  const catCount = {};
  userChecks.forEach(c=>catCount[c.cat]=(catCount[c.cat]||0)+1);
  const longFav = Object.entries(catCount).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).slice(0,2);
  const shortCat = recent[0]?.cat || longFav[0] || '学习';

  const scored = data.pois.filter(p=>p.status==='上线').map(p=>{
    let s = Math.random()*0.3;
    if (useCat && longFav.includes(p.cat)) s += 0.5;
    if (useCat && p.cat===shortCat) s += 0.45;
    if (useTime) {
      const h = new Date().getHours();
      if (h<10 && p.cat==='学习') s += 0.35;
      if (h>=11 && h<14 && p.cat==='餐饮') s += 0.35;
      if (h>=18 && p.cat==='娱乐') s += 0.2;
    }
    return {...p,score:Math.min(0.99,s)};
  }).sort((a,b)=>b.score-a.score).slice(0,k);

  const cost = 80 + Math.floor(Math.random()*220);
  const rec = {
    rec_id: rid(), uid, time: now(), k,
    top1: scored[0]?.name || '-',
    model_type: model.type, model_version: model.version,
    status: '成功', cost,
    request_id: rid('REQ'),
    topk: scored,
    explain: {
      long: `长期偏好：常去类别 ${longFav.join(' / ') || '学习'}；常去区域：学校附近。`,
      short: `短期意图：最近访问链路 ${recent.map(r=>r.poi).reverse().join(' → ') || '暂无足够签到，采用默认策略'}。`
    },
    snapshot: JSON.stringify({k,useTime,useCat,model:model.name,version:model.version},null,2),
    input: userChecks.slice(0,5)
  };
  if (!silent) {
    data.recs.unshift(rec);
    log('/api/recommend','POST',uid,cost,200,'');
  }
  return rec;
}

function buildUserTabs() {
  const tabs=['首页','签到','推荐','历史记录','个人中心'];
  document.getElementById('userTabs').innerHTML = tabs.map(t=>`<button class="${userTab===t?'active-tab':''}" onclick="userTab='${t}';renderUser()">${t}</button>`).join('');
}

function renderUser() {
  if (!currentUser) return;
  buildUserTabs();
  const box = document.getElementById('userViews');
  const checks = data.checkins.filter(c=>c.uid===currentUser.id);
  const recs = data.recs.filter(r=>r.uid===currentUser.id);
  const model = getDefaultModel();

  if (userTab==='首页') {
    const week = checks.filter(c=>Date.now()-new Date(c.time.replace(' ','T')).getTime() < 7*86400000).length;
    box.innerHTML = `<div class="card"><h2>首页概览</h2>
      <div class="grid cards">
        <div class="stat"><div class="label">近7天签到次数</div><div class="value">${week}</div></div>
        <div class="stat"><div class="label">累计签到次数</div><div class="value">${checks.length}</div></div>
        <div class="stat"><div class="label">最近一次推荐Top-1</div><div class="value" style="font-size:17px">${recs[0]?.top1||'暂无'}</div></div>
        <div class="stat"><div class="label">当前默认模型版本</div><div class="value" style="font-size:17px">${model.type} ${model.version}</div></div>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px"><button onclick="userTab='签到';renderUser()">去签到</button><button class="primary" onclick="userTab='推荐';renderUser()">获取推荐</button><button onclick="userTab='历史记录';renderUser()">查看历史</button></div>
    </div>`;
  }

  if (userTab==='签到') {
    box.innerHTML = `<div class="card"><h2>签到</h2>
      <div class="row">
        <div><label>POI 选择（可搜索）</label><input list="poiList" id="ciPoi" placeholder="输入POI名称"/><datalist id="poiList">${data.pois.map(p=>`<option value="${p.name}">${p.cat}</option>`)}</datalist></div>
        <div><label>签到时间</label><input id="ciTime" value="${now().slice(0,16)}"></div>
        <div><label>停留时长（分钟）</label><input id="ciStay" type="number" value="45"></div>
      </div>
      <div style="margin-top:10px"><button class="primary" onclick="addCheckin()">提交签到</button></div>
      <h3 style="margin-top:16px">最近签到列表</h3>
      <table><thead><tr><th>时间</th><th>POI名称</th><th>类别</th><th>停留时长</th></tr></thead>
      <tbody>${checks.slice(0,10).map(c=>`<tr><td>${c.time}</td><td>${c.poi}</td><td>${c.cat}</td><td>${c.stay}分钟</td></tr>`).join('')}</tbody></table>
    </div>`;
  }

  if (userTab==='推荐') {
    box.innerHTML = `<div class="card"><h2>在线推荐</h2>
      <div class="row">
        <div><label>Top-K</label><select id="rk"><option>1</option><option selected>5</option><option>10</option></select></div>
        <div><label>启用时间特征</label><select id="rtime"><option value="true" selected>开启</option><option value="false">关闭</option></select></div>
        <div><label>启用类别特征</label><select id="rcat"><option value="true" selected>开启</option><option value="false">关闭</option></select></div>
      </div>
      <div style="margin-top:10px"><button class="primary" onclick="runRec()">生成推荐</button></div>
      <div id="recResult" style="margin-top:12px">请点击“生成推荐”。</div>
    </div>`;
  }

  if (userTab==='历史记录') {
    box.innerHTML = `<div class="card"><h2>历史记录</h2>
      <div class="tabs">
        <button class="active-tab" onclick="showHistory('ci')">签到历史</button>
        <button onclick="showHistory('rec')">推荐历史</button>
      </div>
      <div id="historyBox"></div>
    </div>`;
    showHistory('ci');
  }

  if (userTab==='个人中心') {
    box.innerHTML = `<div class="card"><h2>个人中心</h2>
      <p>用户名：<b>${currentUser.name}</b></p>
      <p>角色：<b>普通用户</b></p>
      <button onclick="logoutUser()">退出登录</button>
    </div>`;
  }
}

function showHistory(type) {
  const checks = data.checkins.filter(c=>c.uid===currentUser.id);
  const recs = data.recs.filter(r=>r.uid===currentUser.id);
  const box = document.getElementById('historyBox');
  if (type==='ci') {
    box.innerHTML = `<div class="mini">支持时间范围筛选（演示版为静态展示）。</div><table><thead><tr><th>时间</th><th>POI</th><th>类别</th><th>停留</th></tr></thead><tbody>${checks.map(c=>`<tr><td>${c.time}</td><td>${c.poi}</td><td>${c.cat}</td><td>${c.stay}分钟</td></tr>`).join('')}</tbody></table>`;
  } else {
    box.innerHTML = `<table><thead><tr><th>时间</th><th>Top-1结果</th><th>Top-K</th><th>模型版本</th><th>状态</th><th>操作</th></tr></thead><tbody>${recs.map((r,i)=>`<tr><td>${r.time}</td><td>${r.top1}</td><td>${r.k}</td><td>${r.model_type} ${r.model_version}</td><td>${r.status}</td><td><button onclick="openRecDetail('${r.rec_id}')">详情</button></td></tr>`).join('')}</tbody></table><div id="recDetail"></div>`;
  }
}

function openRecDetail(id) {
  const r = data.recs.find(x=>x.rec_id===id);
  document.getElementById('recDetail').innerHTML = `<div class="card" style="margin-top:10px"><h3>推荐详情：${r.rec_id}</h3>
    <p><b>输入摘要：</b>${r.input.map(i=>`${i.time} ${i.poi}`).join('；')}</p>
    <p><b>输出Top-K：</b>${r.topk.map((x,i)=>`${i+1}.${x.name}`).join('，')}</p>
    <p><b>推荐解释：</b>${r.explain.long}<br>${r.explain.short}</p>
    <p><b>配置快照（JSON）：</b></p><pre>${r.snapshot}</pre>
  </div>`;
}

function addCheckin() {
  const poi = document.getElementById('ciPoi').value.trim();
  const time = document.getElementById('ciTime').value.trim();
  const stay = Number(document.getElementById('ciStay').value || 30);
  const p = data.pois.find(x=>x.name===poi);
  if (!p) return toast('userNotice','签到失败：请选择有效POI。');
  data.checkins.unshift({uid:currentUser.id,time,poi:p.name,cat:p.cat,stay});
  log('/api/checkin','POST',currentUser.id,32,200,'');
  toast('userNotice','签到成功，最近签到列表已刷新。');
  renderUser();
}

function runRec() {
  const k = Number(document.getElementById('rk').value);
  const useTime = document.getElementById('rtime').value==='true';
  const useCat = document.getElementById('rcat').value==='true';
  const rec = generateRec(currentUser.id,k,useTime,useCat);
  const html = `<div><h3>Top-${k} 推荐结果</h3>${rec.topk.map((x,i)=>`<div class="rec-card">${i+1}. <b>${x.name}</b>（${x.cat}）<span class="muted"> 置信度 ${(x.score*100).toFixed(1)}%</span></div>`).join('')}
  <details class="collapse"><summary>推荐解释（可选）</summary><p>${rec.explain.long}</p><p>${rec.explain.short}</p></details>
  <div class="card" style="margin-top:8px;background:#f9fcff"><b>本次推理信息：</b><br>请求ID：${rec.request_id} ｜ 模型类型：${rec.model_type} ｜ 模型版本：${rec.model_version} ｜ 耗时：${rec.cost} ms ｜ 状态：${rec.status}</div></div>`;
  document.getElementById('recResult').innerHTML = html;
  toast('userNotice','推荐生成成功，历史记录已写入。');
}

function userLogin() {
  const name = document.getElementById('loginName').value.trim();
  const pwd = document.getElementById('loginPwd').value.trim();
  const u = data.users.find(x=>x.name===name&&x.pwd===pwd&&x.role==='普通用户'&&x.status==='启用');
  if (!u) return toast('userNotice','登录失败：用户名或密码错误。');
  currentUser = u;
  document.getElementById('userAuth').classList.add('hidden');
  document.getElementById('adminAuth').classList.add('hidden');
  document.getElementById('adminApp').classList.add('hidden');
  document.getElementById('userApp').classList.remove('hidden');
  log('/api/login','POST',u.id,26,200,'');
  userTab = '首页';
  renderUser();
}
function registerUser() {
  const n = document.getElementById('regName').value.trim();
  const p1 = document.getElementById('regPwd').value.trim();
  const p2 = document.getElementById('regPwd2').value.trim();
  if (!n || !p1) return toast('userNotice','注册失败：请填写完整信息。');
  if (p1!==p2) return toast('userNotice','注册失败：两次密码不一致。');
  if (data.users.some(u=>u.name===n)) return toast('userNotice','注册失败：用户名已存在。');
  data.users.push({id:data.users.length+1,name:n,pwd:p1,role:'普通用户',status:'启用',created:now().slice(0,10)});
  toast('userNotice','注册成功，请登录。');
}
function logoutUser(){ currentUser=null; document.getElementById('userApp').classList.add('hidden'); document.getElementById('userAuth').classList.remove('hidden'); }

function buildAdminNav() {
  const items=['仪表盘','用户管理','POI管理','类别管理','模型管理','系统配置','接口日志','推荐记录'];
  document.getElementById('adminNav').innerHTML = items.map(i=>`<button class="${adminTab===i?'active-tab':''}" onclick="adminTab='${i}';renderAdmin()">${i}</button>`).join('') + `<hr><button onclick="logoutAdmin()">退出后台</button>`;
}

function renderAdmin() {
  if (!adminAuthed) return;
  buildAdminNav();
  const v = document.getElementById('adminViews');
  if (adminTab==='仪表盘') {
    const today = now().slice(0,10);
    const active = new Set(data.logs.filter(l=>l.time.startsWith(today)).map(l=>l.uid).filter(Boolean)).size;
    const sign = data.logs.filter(l=>l.path.includes('checkin')&&l.time.startsWith(today)).length;
    const req = data.logs.filter(l=>l.path.includes('recommend')&&l.time.startsWith(today)).length;
    const succ = data.logs.filter(l=>l.path.includes('recommend')&&l.code===200).length;
    const avg = Math.round((data.logs.reduce((a,b)=>a+b.cost,0)/(data.logs.length||1)));
    v.innerHTML = `<div class="card"><h2>仪表盘（监控概览）</h2><div class="grid cards">
      <div class="stat"><div class="label">今日活跃用户</div><div class="value">${active}</div></div>
      <div class="stat"><div class="label">今日签到数</div><div class="value">${sign}</div></div>
      <div class="stat"><div class="label">今日推荐请求数</div><div class="value">${req}</div></div>
      <div class="stat"><div class="label">推荐成功率</div><div class="value">${req?Math.round((succ/req)*100):100}%</div></div>
      <div class="stat"><div class="label">平均耗时</div><div class="value">${avg}ms</div></div>
    </div><h3 style="margin-top:14px">最近异常列表</h3><table><thead><tr><th>时间</th><th>接口</th><th>错误信息</th></tr></thead><tbody>${data.logs.filter(x=>x.code!==200).slice(0,8).map(x=>`<tr><td>${x.time}</td><td>${x.path}</td><td>${x.err||'-'}</td></tr>`).join('') || '<tr><td colspan="3">暂无异常</td></tr>'}</tbody></table></div>`;
  }
  if (adminTab==='用户管理') {
    v.innerHTML = `<div class="card"><h2>用户管理</h2><table><thead><tr><th>user_id</th><th>用户名</th><th>角色</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody>${data.users.filter(u=>u.role!=='管理员').map(u=>`<tr><td>${u.id}</td><td>${u.name}</td><td>${u.role}</td><td>${u.status}</td><td>${u.created}</td><td><button onclick="toggleUser(${u.id})">${u.status==='启用'?'禁用':'启用'}</button></td></tr>`).join('')}</tbody></table></div>`;
  }
  if (adminTab==='POI管理') {
    v.innerHTML = `<div class="card"><h2>POI管理</h2><table><thead><tr><th>poi_id</th><th>POI名称</th><th>类别</th><th>纬度</th><th>经度</th><th>状态</th><th>操作</th></tr></thead><tbody>${data.pois.map(p=>`<tr><td>${p.id}</td><td>${p.name}</td><td>${p.cat}</td><td>${p.lat}</td><td>${p.lng}</td><td>${p.status}</td><td><button onclick="togglePoi(${p.id})">上下线</button></td></tr>`).join('')}</tbody></table></div>`;
  }
  if (adminTab==='类别管理') {
    v.innerHTML = `<div class="card"><h2>类别管理</h2><table><thead><tr><th>category_id</th><th>类别名称</th><th>上级类别</th><th>状态</th><th>操作</th></tr></thead><tbody>${data.categories.map((c,i)=>`<tr><td>${i+1}</td><td>${c}</td><td>一级</td><td>启用</td><td><button>编辑</button><button>启用/停用</button></td></tr>`).join('')}</tbody></table></div>`;
  }
  if (adminTab==='模型管理') {
    const cur = getDefaultModel();
    v.innerHTML = `<div class="card"><h2>模型管理（模型注册与切换）</h2><p><b>当前默认模型：</b>${cur.type} / ${cur.version}</p>
      <table><thead><tr><th>model_id</th><th>模型类型</th><th>模型名称</th><th>版本号</th><th>是否启用</th><th>是否默认</th><th>配置字段</th><th>操作</th></tr></thead><tbody>
      ${data.models.map(m=>`<tr><td>${m.id}</td><td>${m.type}</td><td>${m.name}</td><td>${m.version}</td><td>${m.enabled?'是':'否'}</td><td>${m.def?'是':'否'}</td><td>${m.type==='零样本'?'endpoint: '+m.endpoint:'model_path: '+m.model_path}</td><td><button onclick="setDefaultModel('${m.id}')">设为默认</button><button onclick="toggleModel('${m.id}')">启用/禁用</button></td></tr>`).join('')}
      </tbody></table></div>`;
  }
  if (adminTab==='系统配置') {
    v.innerHTML = `<div class="card"><h2>系统配置</h2><table><thead><tr><th>配置键</th><th>配置值</th><th>说明</th><th>更新时间</th><th>操作</th></tr></thead><tbody>${data.configs.map((c,i)=>`<tr><td>${c.k}</td><td><input id="cfg${i}" value="${c.v}"></td><td>${c.desc}</td><td>${c.time}</td><td><button onclick="saveCfg(${i})">保存</button></td></tr>`).join('')}</tbody></table></div>`;
  }
  if (adminTab==='接口日志') {
    v.innerHTML = `<div class="card"><h2>接口日志</h2><div class="mini">支持时间范围、接口路径、状态码筛选（演示版展示全量日志）。</div><table><thead><tr><th>时间</th><th>接口路径</th><th>方法</th><th>用户ID</th><th>耗时(ms)</th><th>状态码</th><th>错误信息</th></tr></thead><tbody>${data.logs.map(l=>`<tr><td>${l.time}</td><td>${l.path}</td><td>${l.method}</td><td>${l.uid||'-'}</td><td>${l.cost}</td><td>${l.code}</td><td>${l.err||'-'}</td></tr>`).join('')}</tbody></table></div>`;
  }
  if (adminTab==='推荐记录') {
    v.innerHTML = `<div class="card"><h2>推荐记录</h2><table><thead><tr><th>rec_id</th><th>用户ID</th><th>时间</th><th>k</th><th>Top-1 POI</th><th>模型类型</th><th>模型版本</th><th>耗时</th><th>状态</th><th>操作</th></tr></thead><tbody>${data.recs.map(r=>`<tr><td>${r.rec_id}</td><td>${r.uid}</td><td>${r.time}</td><td>${r.k}</td><td>${r.top1}</td><td>${r.model_type}</td><td>${r.model_version}</td><td>${r.cost}ms</td><td>${r.status}</td><td><button onclick="adminRecDetail('${r.rec_id}')">详情</button></td></tr>`).join('')}</tbody></table><div id="adminRec"></div></div>`;
  }
}
function adminRecDetail(id){
  const r=data.recs.find(x=>x.rec_id===id);
  document.getElementById('adminRec').innerHTML = `<div class="card" style="margin-top:8px"><h3>推荐详情 - ${id}</h3><p>Top-K: ${r.topk.map((p,i)=>`${i+1}.${p.name}`).join('，')}</p><p>解释：${r.explain.long}<br>${r.explain.short}</p><pre>${r.snapshot}</pre></div>`;
}
function toggleUser(id){ const u=data.users.find(x=>x.id===id); u.status=u.status==='启用'?'禁用':'启用'; toast('adminNotice','用户状态已更新。'); renderAdmin(); }
function togglePoi(id){ const p=data.pois.find(x=>x.id===id); p.status=p.status==='上线'?'下线':'上线'; toast('adminNotice','POI状态已更新。'); renderAdmin(); }
function setDefaultModel(id){ data.models.forEach(m=>m.def=m.id===id); toast('adminNotice','默认模型已切换。用户端下次推荐将展示新模型类型/版本。'); renderAdmin(); }
function toggleModel(id){ const m=data.models.find(x=>x.id===id); m.enabled=!m.enabled; toast('adminNotice','模型启用状态已更新。'); renderAdmin(); }
function saveCfg(i){ data.configs[i].v = document.getElementById('cfg'+i).value; data.configs[i].time=now(); toast('adminNotice','配置已保存。'); renderAdmin(); }

function adminLogin() {
  const name = document.getElementById('adminName').value.trim();
  const pwd = document.getElementById('adminPwd').value.trim();
  const a = data.users.find(x=>x.name===name&&x.pwd===pwd&&x.role==='管理员');
  if (!a) return toast('adminNotice','管理员登录失败。');
  adminAuthed = true;
  document.getElementById('adminAuth').classList.add('hidden');
  document.getElementById('userAuth').classList.add('hidden');
  document.getElementById('userApp').classList.add('hidden');
  document.getElementById('adminApp').classList.remove('hidden');
  log('/api/admin/login','POST',a.id,20,200,'');
  adminTab = '仪表盘';
  renderAdmin();
}
function logoutAdmin(){ adminAuthed=false; document.getElementById('adminApp').classList.add('hidden'); document.getElementById('adminAuth').classList.remove('hidden'); }

function showUserAuth(){
  document.getElementById('userAuth').classList.remove('hidden');
  document.getElementById('adminAuth').classList.add('hidden');
  document.getElementById('userApp').classList.add('hidden');
  document.getElementById('adminApp').classList.add('hidden');
}
function showAdminAuth(){
  document.getElementById('adminAuth').classList.remove('hidden');
  document.getElementById('userAuth').classList.add('hidden');
  document.getElementById('userApp').classList.add('hidden');
  document.getElementById('adminApp').classList.add('hidden');
}

document.getElementById('goUser').onclick = showUserAuth;
document.getElementById('goAdmin').onclick = showAdminAuth;

seed();
showUserAuth();
</script>
</body>
</html>
